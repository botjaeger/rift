<!doctype html>
<!-- Source of public/og.png (1200x630). Regenerate: open this file at a 1200x630 viewport and screenshot it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rift OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050505; font-family: Inter, sans-serif; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 0%, #19aad826, transparent 70%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0a 1px, transparent 1px), linear-gradient(90deg, #ffffff0a 1px, transparent 1px); background-size: 64px 64px; -webkit-mask: radial-gradient(ellipse 70% 65% at 50% 0%, #000 30%, transparent 75%); }
  .c { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; }
  .brand { display: flex; align-items: center; gap: 18px; color: #fff; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  .brand img { width: 76px; height: 76px; }
  h1 { margin: 0; color: #fff; font-size: 76px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 700; }
  p { margin: 0; color: #9b9b9b; font-size: 26px; font-weight: 500; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #19aad8; }
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<div class="c">
  <div class="brand"><img src="rift-1024.png" alt="">Rift</div>
  <h1>Every command is a block.</h1>
  <p>A GPU-accelerated terminal for macOS and Linux</p>
  <span class="mono">select · copy · search · bookmark · re-run</span>
</div>
</body>
</html>
