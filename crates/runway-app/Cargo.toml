[package]
name = "runway-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "runway"
path = "src/main.rs"

[dependencies]
runway-core.workspace = true
runway-pty.workspace = true
runway-renderer.workspace = true
winit.workspace = true
wgpu.workspace = true
log.workspace = true
env_logger.workspace = true
nucleo-matcher.workspace = true
arboard.workspace = true
png.workspace = true
global-hotkey = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
