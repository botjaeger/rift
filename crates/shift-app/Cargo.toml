[package]
name = "shift-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shift-terminal"
path = "src/main.rs"

[dependencies]
shift-core.workspace = true
shift-pty.workspace = true
shift-renderer.workspace = true
winit.workspace = true
wgpu.workspace = true
log.workspace = true
env_logger.workspace = true
nucleo-matcher.workspace = true
arboard.workspace = true
png.workspace = true
global-hotkey = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
accesskit_winit = "0.34"
accesskit = "0.25"
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
