# Rift builtin theme — tokens straight from the design spec (dark-default)
name = "Dark Default"

bg = "#1e1e1e"
bg_chrome = "#181818"
bg_gutter = "#1a1a1a"
surface = "#232326"
border = "#ffffff12"            # rgba(255,255,255,.07)
pane_border_inactive = "#3c3c3c"

fg = "#d4d4d4"
text_bright = "#f0f1f3"
text_ui = "#e6e7ea"
text_dim = "#a1a4ad"
text_muted = "#868993"

accent = "#569cd6"
success = "#22c55e"
error = "#ef4444"
warning = "#d7ba7d"
cursor = "#d4d4d4"
selection = "#264f78"
search_match = "#ffd700"
search_active = "#ff8000"

# 16 base ANSI colors — standard xterm values (spec §1)
ansi = [
    "#0d0d0d", "#cd0000", "#00cd00", "#cdcd00",
    "#0000ee", "#cd00cd", "#00cdcd", "#e5e5e5",
    "#7f7f7f", "#ff0000", "#00ff00", "#ffff00",
    "#5c5cff", "#ff00ff", "#00ffff", "#ffffff",
]

[syntax]
command = "#569cd6"
flag = "#9cdcfe"
string = "#ce9178"
ghost = "#5a5c63"
