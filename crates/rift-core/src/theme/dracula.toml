# Rift builtin theme — Dracula (draculatheme.com, MIT). Base colours and the
# ANSI palette are Dracula's own; chrome and text ramps follow its spec
# (background, current line, selection, comment).
name = "Dracula"

bg = "#282a36"
bg_chrome = "#21222c"
bg_gutter = "#191a21"
surface = "#2f3241"
border = "#ffffff12"
pane_border_inactive = "#44475a"

fg = "#f8f8f2"
text_bright = "#ffffff"
text_ui = "#f8f8f2"
text_dim = "#a4a7c1"
text_muted = "#7c86b4"

accent = "#bd93f9"
success = "#50fa7b"
error = "#ff5555"
warning = "#f1fa8c"
cursor = "#f8f8f2"
selection = "#44475a"
search_match = "#f1fa8c"
