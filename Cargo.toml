[workspace]
resolver = "3"
members = [
    "crates/rift-core",
    "crates/rift-pty",
    "crates/rift-remote",
    "crates/rift-renderer",
    "crates/rift-terminal",
]
exclude = ["vendor"]
# plain `cargo run` / `cargo build` target the app; gates pass --workspace
default-members = ["crates/rift-terminal"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rift-core = { path = "crates/rift-core" }
rift-pty = { path = "crates/rift-pty" }
rift-renderer = { path = "crates/rift-renderer" }
rift-remote = { path = "crates/rift-remote" }

# gfx — wgpu pinned to the major glyphon supports
wgpu = "29"
winit = "0.30"
glyphon = "0.11"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# terminal
alacritty_terminal = "0.26"

# core
serde = { version = "1", features = ["derive"] }
toml = "1"
# Settings saves edit config.toml in place (comments, order, unknown keys)
toml_edit = "0.25"
serde_yaml_ng = "0.10"
serde_json = "1"
arc-swap = "1.9"
notify = "8.2"
nucleo-matcher = "0.3"
arboard = { version = "3.6", features = ["wayland-data-control"] }
git2 = { version = "0.21", default-features = false }
dirs = "6"
log = "0.4"
env_logger = "0.11"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
flate2 = "1"
# remote gateway (`rift-terminal remote`) and relay: sync WebSocket; TLS only
# through rift-remote's `tls` feature (wss:// relay URLs)
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# wss:// relays (rift-remote `tls`): rustls with the ring provider and the
# webpki root set compiled in — no OpenSSL, no platform verifier, same roots
# on macOS and Linux
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# remote gateway v2 (docs/remote-protocol.md): Noise_XX_25519_ChaChaPoly_BLAKE2s
# through snow's pure-Rust default resolver with only the primitives v2 uses
# (no ring, no AES-GCM, no SHA-2 inside snow)
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
# pairing secrets are stored as SHA-256 hashes
sha2 = { version = "0.10", default-features = false }
# pairing QR codes: the module matrix only (no image/svg renderers)
qrcode = { version = "0.14", default-features = false }
# base64url keys and secrets (already in the tree through alacritty_terminal)
base64 = "0.22"
# release-manifest signatures (verify only: no RNG, no PEM)
ed25519-compact = { version = "2.6.0", default-features = false }

# The VT parser and grid are vendored (vendor/README.md) and extended for
# VT420/xterm parity: rectangle editing, left/right margins, selective
# erase, line attributes, national character sets and the query replies.
[patch.crates-io]
vte = { path = "vendor/vte" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[profile.release]
lto = "thin"

# `cargo run` stays smooth: dependencies (glyphon, cosmic-text, wgpu,
# alacritty_terminal) build optimized in dev; Rift's own crates keep fast
# incremental debug builds.
[profile.dev.package."*"]
opt-level = 2
