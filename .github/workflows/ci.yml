name: CI

# Runs the same gate script as local development (scripts/gates.sh) with the
# compiler pinned in rust-toolchain.toml, so a green local run predicts CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            gates: fmt clippy test doc docs release
          - os: ubuntu-24.04
            gates: fmt clippy test doc shell docs mobile site release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Build deps, the libraries winit dlopens, hook checkers, Xvfb + lavapipe.
      # packaging/ci-ubuntu.Dockerfile installs the same list for the local linux gate.
      - name: Install Linux packages (packaging/ci-apt.txt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          xargs -a packaging/ci-apt.txt sudo apt-get install -y

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The mobile gate (Expo companion): Node 22 and the pnpm version
      # pinned in mobile/package.json's packageManager
      - name: Install Node and pnpm
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (corepack)
        if: runner.os == 'Linux'
        working-directory: mobile
        run: corepack enable && pnpm --version

      - name: Gates
        run: scripts/gates.sh ${{ matrix.gates }}
        env:
          # the site gate reads the latest public release (unauthenticated calls are rate-limited)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scripted UI regressions and memory soak (Linux software GPU)
        if: runner.os == 'Linux'
        run: xvfb-run -a scripts/gates.sh ui leak
        env:
          RIFT_TEST_BIN: target/release/rift-terminal
          LIBGL_ALWAYS_SOFTWARE: '1'
          WGPU_BACKEND: vulkan
          # Xvfb is a virtual display: the soak shows its window there
          RIFT_LEAK_SHOWN: '1'
