name: CI

# Runs the same gate script as local development (scripts/gates.sh) with the
# compiler pinned in rust-toolchain.toml, so a green local run predicts CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            gates: fmt clippy test doc docs release
          - os: ubuntu-24.04
            gates: fmt clippy test doc shell docs release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps (winit / wayland / x11) + hook checkers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev pkg-config \
            shellcheck zsh fish xvfb libgl1-mesa-dri mesa-vulkan-drivers

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Gates
        run: scripts/gates.sh ${{ matrix.gates }}

      - name: Scripted UI regressions (Linux software GPU)
        if: runner.os == 'Linux'
        run: xvfb-run -a scripts/gates.sh ui
        env:
          SHIFT_TEST_BIN: target/release/shift-terminal
          LIBGL_ALWAYS_SOFTWARE: '1'
          WGPU_BACKEND: vulkan
