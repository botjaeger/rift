name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build Shift.app
        run: packaging/make-app.sh --target ${{ matrix.target }}

      - name: Build DMG
        run: packaging/make-dmg.sh --arch ${{ matrix.arch }}

      - name: Build tarball
        run: packaging/make-tarball.sh --target ${{ matrix.target }} --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/*.dmg
            target/*.tar.gz
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same list as ci.yml, plus the packaging tools: dpkg-dev for dpkg-deb,
      # file for appimagetool's ELF probing, libfuse2 for the AppImage runtime.
      - name: Install Linux build deps (winit / wayland / x11) + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config \
            dpkg-dev file libfuse2

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release

      - name: Build .deb
        run: packaging/make-deb.sh --no-build

      - name: Build AppImage
        run: packaging/make-appimage.sh --no-build

      - name: Build tarball
        run: packaging/make-tarball.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/*.deb
            target/*.AppImage
            target/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    # A workflow_dispatch run has no tag to attach a release to, so it stops
    # after building and uploading the artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f -print0 | xargs -0 ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
