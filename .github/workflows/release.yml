name: Release

# Builds every package and latest.json (the updater's manifest) as workflow
# artifacts. Nothing is published here: this repository is private, so a
# release attached to it could not be downloaded. The maintainer publishes
# the artifacts to the public botjaeger/shift-releases repository with
# scripts/publish-release.sh (docs/development.md, "Packaging and releases").
# latest.json is NOT signed here: the Ed25519 signing key never reaches CI.
# publish-release.sh signs it on the maintainer's machine and uploads
# latest.json.sig; the updater refuses a manifest without it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        # both on Apple silicon: the Intel build is cross-compiled (the
        # macos-13 Intel runners are retired)
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (rust-toolchain.toml) + the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Shift.app
        run: packaging/make-app.sh --target ${{ matrix.target }}

      - name: Build DMG
        run: packaging/make-dmg.sh --arch ${{ matrix.arch }}

      - name: Build tarball
        run: packaging/make-tarball.sh --target ${{ matrix.target }} --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/*.dmg
            target/*.tar.gz
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same list as ci.yml, plus the packaging tools: dpkg-dev for dpkg-deb,
      # file for appimagetool's ELF probing, libfuse2 for the AppImage runtime.
      - name: Install Linux build deps (winit / wayland / x11) + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config \
            dpkg-dev file libfuse2

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release

      - name: Build .deb
        run: packaging/make-deb.sh --no-build

      - name: Build AppImage
        run: packaging/make-appimage.sh --no-build

      - name: Build tarball
        run: packaging/make-tarball.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/*.deb
            target/*.AppImage
            target/*.tar.gz
          if-no-files-found: error

  manifest:
    name: latest.json
    needs: [validate, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f -print0 | xargs -0 ls -lh

      # the version comes from Cargo.toml; a tag run must name the same one
      - name: Write latest.json
        run: |
          . packaging/lib.sh
          version="$(shift_version)"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          fi
          mkdir -p manifest
          python3 scripts/release-manifest.py "$version" dist -o manifest/latest.json
          python3 scripts/release-manifest.py --verify manifest/latest.json dist
          cat manifest/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: latest-json
          path: manifest/latest.json
          if-no-files-found: error
